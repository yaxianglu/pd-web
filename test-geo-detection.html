<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理位置检测测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>地理位置检测测试</h1>
    
    <div class="test-section">
        <h3>测试IP获取</h3>
        <button onclick="testIP()">获取我的IP</button>
        <div id="ip-result" class="result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h3>测试地理位置检测</h3>
        <button onclick="testLocation()">检测地理位置</button>
        <div id="location-result" class="result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h3>测试语言推荐</h3>
        <button onclick="testLanguageRecommendation()">推荐语言</button>
        <div id="language-result" class="result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h3>完整测试</h3>
        <button onclick="fullTest()">完整测试</button>
        <div id="full-result" class="result" style="display: none;"></div>
    </div>

    <script>
        // 模拟geoLocationService的核心功能
        class TestGeoLocationService {
            async getUserIP() {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    return data.ip;
                } catch (error) {
                    console.warn('Failed to get IP from ipify:', error);
                    try {
                        const response = await fetch('https://ipapi.co/json/');
                        const data = await response.json();
                        return data.ip;
                    } catch (fallbackError) {
                        console.warn('Failed to get IP from ipapi:', fallbackError);
                        return null;
                    }
                }
            }

            async getLocationByIP(ip) {
                try {
                    const response = await fetch(`https://ipapi.co/${ip}/json/`);
                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.reason || 'Failed to get location data');
                    }

                    return {
                        country: data.country_name,
                        countryCode: data.country_code,
                        region: data.region,
                        city: data.city,
                        timezone: data.timezone,
                        latitude: data.latitude,
                        longitude: data.longitude
                    };
                } catch (error) {
                    console.warn('Failed to get location from ipapi:', error);
                    try {
                        const response = await fetch(`http://ip-api.com/json/${ip}?lang=zh-CN`);
                        const data = await response.json();
                        
                        if (data.status === 'fail') {
                            throw new Error(data.message || 'Failed to get location data');
                        }

                        return {
                            country: data.country,
                            countryCode: data.countryCode,
                            region: data.regionName,
                            city: data.city,
                            timezone: data.timezone,
                            latitude: data.lat,
                            longitude: data.lon
                        };
                    } catch (fallbackError) {
                        console.warn('Failed to get location from ip-api:', fallbackError);
                        return null;
                    }
                }
            }

            getRecommendedLanguage(locationData) {
                if (!locationData) {
                    return 'zh-TW';
                }

                const { country, countryCode, region } = locationData;

                if (countryCode === 'CN' || country === 'China') {
                    return 'zh-CN';
                }

                if (countryCode === 'TW' || country === 'Taiwan') {
                    return 'zh-TW';
                }

                if (countryCode === 'HK' || country === 'Hong Kong') {
                    return 'zh-TW';
                }

                if (countryCode === 'MO' || country === 'Macao') {
                    return 'zh-TW';
                }

                if (countryCode === 'SG' || country === 'Singapore') {
                    return 'zh-TW';
                }

                if (countryCode === 'MY' || country === 'Malaysia') {
                    return 'zh-TW';
                }

                return 'en';
            }

            async detectAndRecommendLanguage() {
                try {
                    const ip = await this.getUserIP();
                    if (!ip) {
                        return 'zh-TW';
                    }

                    const location = await this.getLocationByIP(ip);
                    return this.getRecommendedLanguage(location);
                } catch (error) {
                    console.warn('Failed to detect language:', error);
                    return 'zh-TW';
                }
            }
        }

        const geoService = new TestGeoLocationService();

        async function testIP() {
            const resultDiv = document.getElementById('ip-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '正在获取IP...';
            
            try {
                const ip = await geoService.getUserIP();
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `IP地址: ${ip}`;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `错误: ${error.message}`;
            }
        }

        async function testLocation() {
            const resultDiv = document.getElementById('location-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '正在检测地理位置...';
            
            try {
                const ip = await geoService.getUserIP();
                if (!ip) {
                    throw new Error('无法获取IP地址');
                }
                
                const location = await geoService.getLocationByIP(ip);
                if (location) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>地理位置信息:</strong><br>
                        国家: ${location.country} (${location.countryCode})<br>
                        地区: ${location.region}<br>
                        城市: ${location.city}<br>
                        时区: ${location.timezone}
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = '无法获取地理位置信息';
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `错误: ${error.message}`;
            }
        }

        async function testLanguageRecommendation() {
            const resultDiv = document.getElementById('language-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '正在推荐语言...';
            
            try {
                const ip = await geoService.getUserIP();
                if (!ip) {
                    throw new Error('无法获取IP地址');
                }
                
                const location = await geoService.getLocationByIP(ip);
                const recommendedLanguage = geoService.getRecommendedLanguage(location);
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <strong>语言推荐结果:</strong><br>
                    推荐语言: ${recommendedLanguage}<br>
                    地理位置: ${location ? `${location.country} (${location.countryCode})` : '未知'}
                `;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `错误: ${error.message}`;
            }
        }

        async function fullTest() {
            const resultDiv = document.getElementById('full-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '正在进行完整测试...';
            
            try {
                const recommendedLanguage = await geoService.detectAndRecommendLanguage();
                const ip = await geoService.getUserIP();
                const location = await geoService.getLocationByIP(ip);
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <strong>完整测试结果:</strong><br>
                    IP地址: ${ip}<br>
                    国家: ${location ? location.country : '未知'} (${location ? location.countryCode : '未知'})<br>
                    地区: ${location ? location.region : '未知'}<br>
                    城市: ${location ? location.city : '未知'}<br>
                    <strong>推荐语言: ${recommendedLanguage}</strong><br>
                    <br>
                    <strong>预期结果:</strong><br>
                    如果你在中国大陆，应该推荐 zh-CN (简体中文)
                `;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `错误: ${error.message}`;
            }
        }
    </script>
</body>
</html>
